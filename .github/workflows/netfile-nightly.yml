name: clerk-netfile-nightly
# Step 1 of The Clerk Engine: NetFile adapter, STAGING ONLY (staging R2 + staging D1, hidden rows).
# Nightly at 04:47 UTC (~9:47 PM PDT / 8:47 PM PST), before clerk-review (06:23 UTC) so new filings are reviewed the same night. Off the :00/:30 marks, where GitHub's scheduler
# is busiest and runs start hours late. Manual run: Actions tab > Run workflow.
on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated slugs (blank = whole pack)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: clerk-netfile
  cancel-in-progress: false
jobs:
  netfile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard - token present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            msg="Repo secret CLOUDFLARE_API_TOKEN is not set for this repo (Settings > Secrets and variables > Actions > Repository secrets). Nothing was fetched or written."
            echo "::error::$msg"
            printf '## Clerk Engine - NetFile -> staging\n\n**FAILED - config: %s**\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: NetFile -> staging (fetch, sha256, diff vs staging D1, store new to R2, register hidden)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          mkdir -p reports
          python3 adapters/netfile.py --pack packs/la-county-netfile.json \
            --only "$ONLY" --max-seconds 3000 \
            --report "reports/run-$(date -u +%Y%m%dT%H%M).json"
      - name: Daily Clerk report (artifact for Hark to read)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clerk-netfile-report
          path: reports/run-*.json
          if-no-files-found: ignore
          retention-days: 30
