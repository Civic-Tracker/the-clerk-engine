name: clerk-netfile-nightly
# Step 1 of The Clerk Engine: NetFile adapter, STAGING ONLY (staging R2 + staging D1, hidden rows).
# Nightly 2:30 AM Pacific-ish (09:30 UTC). Manual run: Actions tab > Run workflow.
on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated slugs (blank = whole pack)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: clerk-netfile
  cancel-in-progress: false
jobs:
  netfile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard - token present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Repo secret CLOUDFLARE_API_TOKEN not set (see README: TODO for Bryan)"; exit 1; fi
      - name: NetFile -> staging (fetch, sha256, diff vs staging D1, store new to R2, register hidden)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 adapters/netfile.py --pack packs/la-county-netfile.json \
            --only "${{ github.event.inputs.only }}" --max-seconds 3000 \
            --report "reports/run-$(date -u +%Y%m%dT%H%M).json"
      - name: Daily Clerk report (artifact for Hark to read)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clerk-netfile-report
          path: reports/run-*.json
          retention-days: 30
